\">PRÉVU<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">RÉEL<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">DÉCALAGE<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">DURÉE<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">PLEIN<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">LEST<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">ÉTAT<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:60px 1.2fr 1fr 1fr 1fr 1fr 1fr 1fr 1.1fr;gap:1px;background:#1b222b;font-size:15px\">\n          <sc-for list=\"{{ p.timeline }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <div style=\"background:{{ r.bg }};padding:9px 10px;color:#7f8b99;font-family:var(--font-heading);font-size:18px\">{{ r.no }}<\u002Fdiv>\n            <div style=\"background:{{ r.bg }};padding:9px 10px;font-family:var(--font-heading);font-size:19px\">{{ r.name }}<\u002Fdiv>\n            <div style=\"background:{{ r.bg }};padding:9px 10px\">{{ r.planned }}<\u002Fdiv>\n            <div style=\"background:{{ r.bg }};padding:9px 10px\">{{ r.real }}<\u002Fdiv>\n            <div style=\"background:{{ r.bg }};padding:9px 10px;color:#c3ccd6\">{{ r.drift }}<\u002Fdiv>\n            <div style=\"background:{{ r.bg }};padding:9px 10px\">{{ r.dur }}<\u002Fdiv>\n            <div style=\"background:{{ r.bg }};padding:9px 10px;color:#94bce3\">{{ r.refuel }}<\u002Fdiv>\n            <div style=\"background:{{ r.bg }};padding:9px 10px\">{{ r.ballast }}<\u002Fdiv>\n            <div style=\"background:{{ r.bg }};padding:9px 10px;color:{{ r.col }};letter-spacing:0.08em;font-size:13px\">{{ r.state }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabPilotes }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"border:1px solid #2b3542;background:#12171e\">\n        <div style=\"padding:14px 16px;border-bottom:1px solid #2b3542;font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">LES 5 PILOTES<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.1fr 0.8fr 0.8fr 0.9fr 0.6fr 0.9fr 0.9fr 0.9fr 0.9fr 0.9fr 1fr 1.1fr;gap:1px;background:#222b36;font-size:11px;letter-spacing:0.1em;color:#7f8b99\">\n          <div style=\"background:#0e1319;padding:8px 10px\">PILOTE<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">POIDS<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">LEST AU PLEIN<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">TOTAL PILOTÉ<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">RELAIS<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">REPOS<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">AVANT 6 H<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">MINI IMPOSÉ<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">MOYENNE<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">MEILLEUR<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">STATUT<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">NOTE / FATIGUE<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.1fr 0.8fr 0.8fr 0.9fr 0.6fr 0.9fr 0.9fr 0.9fr 0.9fr 0.9fr 1fr 1.1fr;gap:1px;background:#1b222b;font-size:15px\">\n          <sc-for list=\"{{ p.drivers }}\" as=\"d\" hint-placeholder-count=\"5\">\n            <div style=\"background:#12171e;padding:9px 10px;font-family:var(--font-heading);font-size:21px\">{{ d.name }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:6px 8px;display:flex;flex-direction:column;gap:2px\">\n              <input class=\"input\" type=\"number\" step=\"0.5\" value=\"{{ d.w }}\" sc-camel-on-change=\"{{ d.setW }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;padding:4px 6px;width:100%\">\n              <span style=\"font-size:9px;letter-spacing:0.1em;color:{{ d.provCol }}\">{{ d.prov }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 10px;color:#94bce3\">{{ d.ballastFull }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 10px\">{{ d.total }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 10px\">{{ d.stints }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 10px\">{{ d.rest }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 10px;color:{{ d.left6Col }}\">{{ d.left6 }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 10px;color:{{ d.miniCol }};font-size:13px\">{{ d.mini }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 10px\">{{ d.avg }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 10px\">{{ d.best }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 10px;color:{{ d.col }};font-size:13px;letter-spacing:0.06em\">{{ d.status }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:6px 8px\">\n              <input class=\"input\" type=\"text\" value=\"{{ d.note }}\" sc-camel-on-change=\"{{ d.setNote }}\" placeholder=\"fatigue, remarque…\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;padding:4px 6px;width:100%\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabPoids }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:22px;align-items:start\">\n        <section class=\"blueprint\" style=\"background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">CALCULATEUR DE POIDS<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99\">Poids total = {{ cfgv.kart }} kg + essence + pilote + lest · minimum {{ cfgv.minW }} kg<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ p.calc.drivers }}\" as=\"d\" hint-placeholder-count=\"5\">\n              <button type=\"button\" sc-camel-on-click=\"{{ d.pick }}\" style=\"background:{{ d.bg }};color:{{ d.fg }};border:1px solid #3a4757;padding:8px 14px;font-family:var(--font-heading);font-size:16px;letter-spacing:0.06em;cursor:pointer\">{{ d.name }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:0.12em;color:#7f8b99\">ESSENCE À BORD (KG)\n              <input class=\"input\" type=\"number\" step=\"0.5\" value=\"{{ p.calc.fuel }}\" sc-camel-on-change=\"{{ p.calc.setFuel }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;font-size:22px;font-family:var(--font-heading)\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:0.12em;color:#7f8b99\">LEST INSTALLÉ (KG)\n              <input class=\"input\" type=\"number\" step=\"2.5\" value=\"{{ p.calc.ballast }}\" sc-camel-on-change=\"{{ p.calc.setBallast }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;font-size:22px;font-family:var(--font-heading)\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ p.calc.auto }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757;align-self:flex-start\">RECALCULER LE LEST MINIMUM<\u002Fbutton>\n          <div style=\"display:flex;align-items:baseline;gap:14px;border-top:1px solid #2b3542;padding-top:14px\">\n            <div style=\"font-family:var(--font-heading);font-size:96px;line-height:0.85;font-weight:700;color:{{ p.calc.col }}\">{{ p.calc.total }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column\">\n              <span style=\"font-family:var(--font-heading);font-size:22px;color:#7f8b99\">KG TOTAL<\u002Fspan>\n              <span style=\"font-family:var(--font-heading);font-size:26px;color:{{ p.calc.col }}\">MARGE {{ p.calc.marge }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#2b3542;border:1px solid #2b3542\">\n            <div style=\"background:#12171e;padding:10px 12px\"><div style=\"font-size:10px;letter-spacing:0.14em;color:#7f8b99\">LEST MINI LÉGAL<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:30px;color:#94bce3\">{{ p.calc.min }} kg<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#12171e;padding:10px 12px\"><div style=\"font-size:10px;letter-spacing:0.14em;color:#7f8b99\">LEST CONSEILLÉ<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:30px;color:#94bce3\">{{ p.calc.advised }} kg<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ p.calc.under }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:2px solid #ff4a3d;background:#2a0f0d;padding:14px;font-family:var(--font-heading);font-size:24px;color:#ff6b5f;animation:sodebaPulse 1s infinite\">SOUS-POIDS — NE PAS FAIRE SORTIR LE KART<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e\">\n          <div style=\"padding:14px 16px;border-bottom:1px solid #2b3542;font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">LEST PAR PILOTE, RÉSERVOIR PLEIN<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:1px;background:#222b36;font-size:11px;letter-spacing:0.1em;color:#7f8b99\">\n            <div style=\"background:#0e1319;padding:8px 10px\">PILOTE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">POIDS<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">LEST AU PLEIN<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">FIABILITÉ<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:1px;background:#1b222b;font-size:16px\">\n            <sc-for list=\"{{ p.drivers }}\" as=\"d\" hint-placeholder-count=\"5\">\n              <div style=\"background:#12171e;padding:10px;font-family:var(--font-heading);font-size:21px\">{{ d.name }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:10px\">{{ d.w }} kg<\u002Fdiv>\n              <div style=\"background:#12171e;padding:10px;color:#94bce3;font-family:var(--font-heading);font-size:21px\">{{ d.ballastFull }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:10px;font-size:12px;letter-spacing:0.08em;color:{{ d.provCol }}\">{{ d.prov }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:14px 16px;font-size:13px;color:#7f8b99;line-height:1.5\">Le lest n’est jamais figé : il est recalculé à chaque affichage à partir de l’essence réellement présente. Arrondi supérieur par blocs de {{ cfgv.step }} kg, plafonné à {{ cfgv.ballastMax }} kg.<\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabEssence }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:22px;align-items:start\">\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">MODE CARBURANT<\u002Fdiv>\n          <div style=\"display:flex;border:1px solid #2b3542;align-self:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.fuelPanel.setAuto }}\" style=\"background:transparent;color:#e6ebf1;border:0;padding:10px 16px;font-family:var(--font-heading);font-size:15px;letter-spacing:0.08em;cursor:pointer\">ESTIMATION<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.fuelPanel.setManual }}\" style=\"background:transparent;color:#e6ebf1;border:0;padding:10px 16px;font-family:var(--font-heading);font-size:15px;letter-spacing:0.08em;cursor:pointer\">MANUEL<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;color:#c3ccd6\">Mode actif : <strong>{{ p.fuelPanel.mode }}<\u002Fstrong>. Dernière saisie : {{ p.fuelPanel.measured }}.<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-end\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:0.12em;color:#7f8b99;flex:1\">CARBURANT MESURÉ / SAISI (KG)\n              <input class=\"input\" type=\"number\" step=\"0.1\" value=\"{{ p.fuelPanel.input }}\" sc-camel-on-change=\"{{ p.fuelPanel.setInput }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;font-size:22px;font-family:var(--font-heading)\">\n            <\u002Flabel>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.fuelPanel.commit }}\" class=\"btn btn-primary\" style=\"background:#94bce3;color:#0b0e12;padding:12px 18px\">ENREGISTRER<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">En mode estimation, la quantité est déduite de la consommation moyenne ({{ cfgv.conso }} kg/h) et du temps passé en piste. Toute valeur non mesurée est affichée ESTIMÉE.<\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">FRÉQUENCE DE RAVITAILLEMENT<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ p.fuelPanel.freqs }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ f.set }}\" style=\"background:{{ f.bg }};color:{{ f.fg }};border:1px solid #3a4757;padding:10px 16px;font-family:var(--font-heading);font-size:16px;cursor:pointer\">{{ f.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#2b3542;border:1px solid #2b3542\">\n            <sc-for list=\"{{ fuelS.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"background:#12171e;padding:10px 12px\">\n                <div style=\"font-size:10px;letter-spacing:0.14em;color:#7f8b99\">{{ c.label }}<\u002Fdiv>\n                <div style=\"font-family:var(--font-heading);font-size:28px;color:{{ c.col }}\">{{ c.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:34px;color:{{ fuelS.col }}\">PLEIN AU PROCHAIN ARRÊT : {{ fuelS.nextRefuel }}<\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:12px\" id=\"saisie-live\">\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">SOURCE LIVE TIMING<\u002Fdiv>\n          <div style=\"font-size:13px;color:#c3ccd6;line-height:1.5\">Le site Apex Timing ne peut pas être lu directement depuis le navigateur. Renseignez l’URL d’un relais serveur renvoyant du JSON ; sans lui l’application reste pilotée par la saisie manuelle ci-dessous.<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:0.12em;color:#7f8b99;flex:1;min-width:240px\">URL DU PROXY / API\n              <input class=\"input\" type=\"text\" value=\"{{ p.apex.url }}\" sc-camel-on-change=\"{{ p.apex.setUrl }}\" placeholder=\"https://…/kart15.json\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\">\n            <\u002Flabel>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.apex.test }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757\">TESTER<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;letter-spacing:0.08em;color:{{ p.apex.statusCol }}\">ÉTAT : {{ p.apex.status }} · dernière donnée {{ p.apex.updated }} ({{ p.apex.src }})<\u002Fdiv>\n          <div style=\"font-size:13px;color:#c3ccd6\">{{ p.apex.neighbours }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#ffb96b\">{{ p.apex.reason }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#7f8b99;line-height:1.5\">Une fois l’URL renseignée, l’application interroge le relais toutes les 20 secondes. Format JSON attendu : position, positionCategory, gapLeader, gapAhead, gapBehind, status (PISTE ou PIT). Un status PIT déclenche automatiquement le chrono d’arrêt.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px\">\n            <label style=\"display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">POSITION SCRATCH\n              <input class=\"input\" type=\"text\" value=\"{{ p.apex.pos }}\" sc-camel-on-change=\"{{ p.apex.setPos }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">POSITION ROOKIE\n              <input class=\"input\" type=\"text\" value=\"{{ p.apex.posCat }}\" sc-camel-on-change=\"{{ p.apex.setPosCat }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">ÉCART LEADER\n              <input class=\"input\" type=\"text\" value=\"{{ p.apex.gapLeader }}\" sc-camel-on-change=\"{{ p.apex.setGl }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">ÉCART DEVANT\n              <input class=\"input\" type=\"text\" value=\"{{ p.apex.gapAhead }}\" sc-camel-on-change=\"{{ p.apex.setGa }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">ÉCART DERRIÈRE\n              <input class=\"input\" type=\"text\" value=\"{{ p.apex.gapBehind }}\" sc-camel-on-change=\"{{ p.apex.setGb }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabPit }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:minmax(320px,0.9fr) minmax(380px,1.1fr);gap:22px;align-items:start\">\n        <section style=\"border:1px solid {{ pit.chronoCol }};background:#12171e;padding:22px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:12px;letter-spacing:0.18em;color:#7f8b99\">CHRONO PIT · MINIMUM {{ cfgv.pitMin }} SECONDES<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:190px;line-height:0.8;font-weight:700;color:{{ pit.chronoCol }}\">{{ pit.chrono }}<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:44px;line-height:1;color:{{ pit.chronoCol }};animation:{{ pit.anim }}\">{{ pit.gate }}<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ actions.pitIn }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757;font-size:17px;padding:14px 20px\">ENTRÉE STAND<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.pitActions.withFuel }}\" class=\"btn\" style=\"background:{{ pit.outBg }};color:#0b0e12;font-size:17px;padding:14px 20px\">SORTIE AVEC PLEIN<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.pitActions.without }}\" class=\"btn\" style=\"background:{{ pit.outBg }};color:#0b0e12;font-size:17px;padding:14px 20px\">SORTIE SANS PLEIN<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.pitActions.tech }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757;font-size:17px;padding:14px 20px\">ARRÊT TECHNIQUE<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #2b3542;padding-top:14px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:11px;letter-spacing:0.14em;color:#7f8b99\">RAVITAILLEMENT PENDANT LE RELAIS — HORS DES 45 MIN<\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.pause.toggle }}\" class=\"btn\" style=\"background:{{ p.pause.col }};color:#0b0e12;font-size:17px;padding:12px 18px;align-self:flex-start\">{{ p.pause.label }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #2b3542;padding-top:14px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:11px;letter-spacing:0.14em;color:#7f8b99\">PESÉE À LA BALANCE<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap\">\n              <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.1em;color:#7f8b99;flex:1;min-width:150px\"><span>POIDS CONSTATÉ (KG)<\u002Fspan>\n                <input class=\"input\" type=\"number\" step=\"0.5\" value=\"{{ p.weighForm.value }}\" sc-camel-on-change=\"{{ p.weighForm.set }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;font-family:var(--font-heading);font-size:22px\">\n              <\u002Flabel>\n              <button type=\"button\" sc-camel-on-click=\"{{ p.weighForm.add }}\" class=\"btn btn-primary\" style=\"background:#94bce3;color:#0b0e12;padding:11px 16px\">ENREGISTRER<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ p.weighForm.recal }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757\">RECALER L’ESSENCE<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-for list=\"{{ p.weigh }}\" as=\"w\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:12px;font-size:14px;border-bottom:1px solid #1b222b;padding:5px 0\">\n                <span style=\"color:#7f8b99;min-width:44px\">{{ w.t }}<\u002Fspan>\n                <span style=\"min-width:70px\">{{ w.driver }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading);font-size:18px;color:{{ w.col }}\">{{ w.kg }} kg<\u002Fspan>\n                <span style=\"color:#7f8b99\">calculé {{ w.computed }} · écart {{ w.delta }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e\">\n          <div style=\"padding:14px 16px;border-bottom:1px solid #2b3542;display:flex;justify-content:space-between;align-items:baseline\">\n            <span style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">CHECKLIST ARRÊT<\u002Fspan>\n            <span style=\"font-size:14px;color:#c3ccd6\">{{ cur.name }} → {{ next.name }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid #1b222b\"><span style=\"font-size:14px;letter-spacing:0.06em;color:#c3ccd6\">1 · PLEIN<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:30px;color:{{ fuelS.col }}\">{{ fuelS.nextRefuel }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid #1b222b\"><span style=\"font-size:14px;letter-spacing:0.06em;color:#c3ccd6\">2 · LEST À MODIFIER<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:30px;color:#94bce3\">{{ pit.ballastDelta }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid #1b222b\"><span style=\"font-size:14px;letter-spacing:0.06em;color:#c3ccd6\">3 · LEST FINAL<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:30px\">{{ pit.ballastFinal }} kg<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid #1b222b\"><span style=\"font-size:14px;letter-spacing:0.06em;color:#c3ccd6\">4 · POIDS PILOTE ENTRANT<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:30px\">{{ next.weight }} kg<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid #1b222b\"><span style=\"font-size:14px;letter-spacing:0.06em;color:#c3ccd6\">5 · ESSENCE {{ wt.src }}<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:30px\">{{ wt.fuelKg }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid #1b222b\"><span style=\"font-size:14px;letter-spacing:0.06em;color:#c3ccd6\">6 · POIDS TOTAL PRÉVU<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:30px;color:{{ pit.wCol }}\">{{ pit.totalW }} kg<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid #1b222b\"><span style=\"font-size:14px;letter-spacing:0.06em;color:#c3ccd6\">7 · MARGE<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:30px;color:{{ pit.wCol }}\">{{ pit.margeLabel }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px;border-bottom:1px solid #1b222b\"><span style=\"font-size:14px;letter-spacing:0.06em;color:#c3ccd6\">8 · ÉLIGIBILITÉ PILOTE<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:30px;color:{{ next.col }}\">{{ next.status }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:11px 16px\"><span style=\"font-size:14px;letter-spacing:0.06em;color:#c3ccd6\">9 · SORTIE APRÈS {{ cfgv.pitMin }} S<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:30px;color:{{ pit.chronoCol }}\">{{ pit.gate }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabIng }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px\">\n          <div style=\"border:1px solid #2b3542;background:#12171e;padding:16px\"><div style=\"font-size:11px;letter-spacing:0.16em;color:#7f8b99\">LE PLUS RAPIDE<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:30px;color:#94bce3\">{{ p.sup.fast }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #2b3542;background:#12171e;padding:16px\"><div style=\"font-size:11px;letter-spacing:0.16em;color:#7f8b99\">LE PLUS RÉGULIER<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:30px;color:#94bce3\">{{ p.sup.steady }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #2b3542;background:#12171e;padding:16px\"><div style=\"font-size:11px;letter-spacing:0.16em;color:#7f8b99\">SE DÉGRADE LE MOINS<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:30px;color:#94bce3\">{{ p.sup.deg }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <section style=\"border:1px solid #2b3542;background:#12171e\">\n          <div style=\"padding:14px 16px;border-bottom:1px solid #2b3542;font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">ANALYSE PAR PILOTE<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 0.7fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;gap:1px;background:#222b36;font-size:11px;letter-spacing:0.1em;color:#7f8b99\">\n            <div style=\"background:#0e1319;padding:8px 10px\">PILOTE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">TOURS<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">MOYENNE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">MÉDIANE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">MEILLEUR<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">RÉGULARITÉ<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">DÉGRADATION<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">5 DERNIERS<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">ÉCART AU MEILLEUR<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 0.7fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;gap:1px;background:#1b222b;font-size:16px\">\n            <sc-for list=\"{{ p.anRows }}\" as=\"a\" hint-placeholder-count=\"5\">\n              <div style=\"background:#12171e;padding:9px 10px;font-family:var(--font-heading);font-size:21px\">{{ a.name }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ a.laps }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ a.avg }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ a.med }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px;color:#94bce3\">{{ a.best }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ a.sd }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px;color:{{ a.degCol }}\">{{ a.deg }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ a.last5 }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px;color:#c3ccd6\">{{ a.delta }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:14px 16px;font-size:13px;color:#7f8b99;line-height:1.5\">Régularité = écart-type des tours (hors 10 % les plus lents). Dégradation = écart entre le premier et le dernier tiers de chaque relais. Aucune recommandation ne propose de dépasser {{ cfgv.maxDriverH }} h de pilotage ou de descendre sous {{ cfgv.restMin }} min de repos.<\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabJournal }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end\">\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:0.12em;color:#7f8b99;flex:1;min-width:280px\">NOTE, INCIDENT OU PÉNALITÉ\n            <input class=\"input\" type=\"text\" value=\"{{ p.io.noteText }}\" sc-camel-on-change=\"{{ p.io.setNote }}\" placeholder=\"ex. contact virage 4, aucun dégât\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\">\n          <\u002Flabel>\n          <button type=\"button\" sc-camel-on-click=\"{{ p.io.addNote }}\" class=\"btn btn-primary\" style=\"background:#94bce3;color:#0b0e12;padding:11px 18px\">AJOUTER<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ p.io.csv }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757\">EXPORT CSV<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ p.io.xls }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757\">EXPORT EXCEL<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ p.io.pdf }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757\">EXPORT PDF<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ p.io.json }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757\">SAUVEGARDE JSON<\u002Fbutton>\n        <\u002Fdiv>\n        <section style=\"border:1px solid #2b3542;background:#12171e\">\n          <div style=\"display:grid;grid-template-columns:60px 0.8fr 1fr 0.9fr 0.7fr 1.2fr 0.8fr 0.9fr 0.7fr 0.8fr;gap:1px;background:#222b36;font-size:11px;letter-spacing:0.1em;color:#7f8b99\">\n            <div style=\"background:#0e1319;padding:8px 10px\">N°<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">SORTIE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">PILOTE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">DURÉE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">PIT<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">ESSENCE (KG)<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">LEST<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">POIDS<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">TOURS<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px\">PLEIN<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:60px 0.8fr 1fr 0.9fr 0.7fr 1.2fr 0.8fr 0.9fr 0.7fr 0.8fr;gap:1px;background:#1b222b;font-size:15px\">\n            <sc-for list=\"{{ p.journal }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <div style=\"background:#12171e;padding:9px 10px;color:#7f8b99;border-left:3px solid {{ r.flag }}\">{{ r.no }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ r.t }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px;font-family:var(--font-heading);font-size:19px\">{{ r.driver }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ r.dur }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ r.pit }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px;color:#c3ccd6\">{{ r.fuel }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ r.ballast }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ r.weight }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ r.laps }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px;color:#94bce3\">{{ r.refuel }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n            <span style=\"font-family:var(--font-heading);font-size:18px;letter-spacing:0.12em\">PÉNALITÉS REÇUES<\u002Fspan>\n            <span style=\"font-family:var(--font-heading);font-size:26px;color:{{ penTotalCol }}\">{{ penTotalLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ p.penForm.presets }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <button type=\"button\" sc-camel-on-click=\"{{ r.set }}\" style=\"background:transparent;color:#c3ccd6;border:1px solid #2b3542;padding:5px 10px;font-size:12px;cursor:pointer\">{{ r.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.1em;color:#7f8b99;width:90px\"><span>TOURS<\u002Fspan>\n              <input class=\"input\" type=\"number\" step=\"1\" value=\"{{ p.penForm.laps }}\" sc-camel-on-change=\"{{ p.penForm.setLaps }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;font-family:var(--font-heading);font-size:20px\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.1em;color:#7f8b99;flex:1;min-width:200px\"><span>MOTIF<\u002Fspan>\n              <input class=\"input\" type=\"text\" value=\"{{ p.penForm.reason }}\" sc-camel-on-change=\"{{ p.penForm.setReason }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.penForm.add }}\" class=\"btn\" style=\"background:#ff4a3d;color:#0b0e12;padding:11px 16px\">ENREGISTRER<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-for list=\"{{ p.pens }}\" as=\"q\" hint-placeholder-count=\"0\">\n            <div style=\"display:flex;gap:12px;font-size:15px;border-bottom:1px solid #1b222b;padding:6px 0\">\n              <span style=\"color:#7f8b99;min-width:44px\">{{ q.t }}<\u002Fspan>\n              <span style=\"font-family:var(--font-heading);font-size:19px;color:#ff6b5f;min-width:70px\">{{ q.laps }}<\u002Fspan>\n              <span style=\"flex:1\">{{ q.reason }}<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ q.remove }}\" style=\"background:transparent;color:#7f8b99;border:1px solid #2b3542;padding:2px 10px;font-size:12px;letter-spacing:0.08em;cursor:pointer\">SUPPRIMER<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:16px;display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-family:var(--font-heading);font-size:18px;letter-spacing:0.12em\">NOTES ET INCIDENTS<\u002Fdiv>\n          <sc-for list=\"{{ p.notes }}\" as=\"n\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;gap:12px;font-size:15px;border-bottom:1px solid #1b222b;padding:6px 0\"><span style=\"color:#7f8b99\">{{ n.t }}<\u002Fspan><span>{{ n.text }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabSimu }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:22px;align-items:start\">\n        <section class=\"blueprint\" style=\"background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">ET SI LES RELAIS DURAIENT…<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ p.sim.quick }}\" as=\"q\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ q.set }}\" style=\"background:{{ q.bg }};color:{{ q.fg }};border:1px solid #3a4757;padding:10px 18px;font-family:var(--font-heading);font-size:18px;cursor:pointer\">{{ q.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\"><span>DURÉE DE RELAIS SIMULÉE (MIN)<\u002Fspan>\n            <input class=\"input\" type=\"number\" step=\"1\" value=\"{{ p.sim.len }}\" sc-camel-on-change=\"{{ p.sim.setLen }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;font-family:var(--font-heading);font-size:24px\">\n          <\u002Flabel>\n          <div style=\"font-size:15px;color:#c3ccd6\">{{ p.sim.stints }} relais restants jusqu’à l’arrivée avec cette durée.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.1fr;gap:1px;background:#1b222b;font-size:15px;border:1px solid #2b3542\">\n            <div style=\"background:#0e1319;padding:8px 10px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">PILOTE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">ACTUEL<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">À L’ARRIVÉE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">VERDICT<\u002Fdiv>\n            <sc-for list=\"{{ p.sim.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"background:#12171e;padding:9px 10px;font-family:var(--font-heading);font-size:20px\">{{ r.name }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ r.now }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px\">{{ r.end }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:9px 10px;color:{{ r.col }};font-size:13px\">{{ r.verdict }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-for list=\"{{ p.sim.viol }}\" as=\"v\" hint-placeholder-count=\"0\">\n            <div style=\"border-left:3px solid #ff4a3d;padding:6px 0 6px 12px;font-size:14px;color:#ff6b5f\">{{ v.text }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n            <span style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">PLAN OPTIMISÉ DES RELAIS RESTANTS<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.applyPlan }}\" class=\"btn btn-primary\" style=\"background:#94bce3;color:#0b0e12\">APPLIQUER<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">Répartition calculée pour respecter 1 h 20 de repos, {{ cfgv.minDriveMin }} min minimum et {{ cfgv.maxDriverH }} h maximum par pilote, avec un plein tous les {{ cfgv.refuelEvery }} relais.<\u002Fdiv>\n          <sc-for list=\"{{ p.planViol }}\" as=\"v\" hint-placeholder-count=\"0\">\n            <div style=\"border-left:3px solid #ffa03c;padding:6px 0 6px 12px;font-size:14px;color:#ffb96b\">{{ v.text }}<\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:grid;grid-template-columns:60px 1.2fr 1fr 1fr 1fr;gap:1px;background:#1b222b;font-size:15px;border:1px solid #2b3542\">\n            <div style=\"background:#0e1319;padding:8px 10px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">N°<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">PILOTE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">SORTIE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">DURÉE<\u002Fdiv>\n            <div style=\"background:#0e1319;padding:8px 10px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\">PLEIN<\u002Fdiv>\n            <sc-for list=\"{{ p.plan }}\" as=\"r\" hint-placeholder-count=\"10\">\n              <div style=\"background:#12171e;padding:8px 10px;color:#7f8b99\">{{ r.no }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:8px 10px;font-family:var(--font-heading);font-size:19px\">{{ r.name }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:8px 10px\">{{ r.at }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:8px 10px\">{{ r.dur }}<\u002Fdiv>\n              <div style=\"background:#12171e;padding:8px 10px;color:#94bce3\">{{ r.refuel }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabAlertes }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:22px;align-items:start\">\n        <section class=\"blueprint\" style=\"background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">PILOTES ET TÉLÉPHONES<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">Chaque pilote ouvre cette application sur son téléphone, se désigne comme « cet appareil » et autorise les notifications : il est prévenu {{ p.alerts.lead }} min avant son relais. Le calendrier, lui, fonctionne même application fermée.<\u002Fdiv>\n          <sc-for list=\"{{ p.alerts.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #1b222b;padding:8px 0\">\n              <span style=\"font-family:var(--font-heading);font-size:22px;min-width:86px\">{{ r.name }}<\u002Fspan>\n              <input class=\"input\" type=\"tel\" value=\"{{ r.tel }}\" sc-camel-on-change=\"{{ r.setTel }}\" placeholder=\"+33 6 12 34 56 78\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;width:180px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ r.pick }}\" style=\"background:transparent;color:{{ r.mineCol }};border:1px solid #2b3542;padding:5px 10px;font-size:11px;letter-spacing:0.1em;cursor:pointer\">{{ r.mine }}<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ r.ics }}\" style=\"background:transparent;color:#c3ccd6;border:1px solid #2b3542;padding:5px 10px;font-size:11px;letter-spacing:0.1em;cursor:pointer\">CALENDRIER<\u002Fbutton>\n              <sc-if value=\"{{ r.hasTel }}\" hint-placeholder-val=\"{{ true }}\">\n                <a href=\"{{ r.wa }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;letter-spacing:0.08em;border:1px solid #2b3542;padding:5px 10px\">WHATSAPP<\u002Fa>\n                <a href=\"{{ r.sms }}\" style=\"font-size:12px;letter-spacing:0.08em;border:1px solid #2b3542;padding:5px 10px\">SMS<\u002Fa>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.noTel }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:12px;letter-spacing:0.08em;color:#5a6673\">numéro à renseigner<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.1em;color:#7f8b99;width:150px\"><span>PRÉVENIR X MIN AVANT<\u002Fspan>\n              <input class=\"input\" type=\"number\" step=\"5\" value=\"{{ p.alerts.lead }}\" sc-camel-on-change=\"{{ p.alerts.setLead }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;font-family:var(--font-heading);font-size:20px\"><\u002Flabel>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.alerts.icsAll }}\" class=\"btn btn-primary\" style=\"background:#94bce3;color:#0b0e12;padding:11px 16px\">CALENDRIER COMPLET<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section class=\"blueprint\" style=\"background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n            <span style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">ENVOI AUTOMATIQUE TELEGRAM<\u002Fspan>\n            <span style=\"font-size:12px;letter-spacing:0.1em;color:{{ p.tg.statusCol }}\">{{ p.tg.status }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">Les messages partent seuls, sans que personne n’appuie. Cet écran doit rester ouvert sur le PC du stand : c’est lui qui connaît l’état de la course. Mode d’emploi pas à pas dans le guide, section Telegram.<\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\"><span>JETON DU ROBOT (DONNÉ PAR BOTFATHER)<\u002Fspan>\n            <input class=\"input\" type=\"text\" value=\"{{ p.tg.token }}\" sc-camel-on-change=\"{{ p.tg.setToken }}\" placeholder=\"1234567890:AAE...\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\"><span>IDENTIFIANT DU GROUPE<\u002Fspan>\n            <input class=\"input\" type=\"text\" value=\"{{ p.tg.chat }}\" sc-camel-on-change=\"{{ p.tg.setChat }}\" placeholder=\"-1001234567890\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.tg.test }}\" class=\"btn btn-primary\" style=\"background:#94bce3;color:#0b0e12;padding:11px 16px\">ENVOYER UN TEST<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.tg.toggle }}\" class=\"btn\" style=\"background:{{ p.tg.onBg }};color:#0b0e12;padding:11px 16px\">{{ p.tg.onLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ p.tg.demo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid #ffa03c;background:#2a1c0a;padding:12px;font-size:14px;color:#ffb96b;line-height:1.5\">Aucun message automatique ne partira tant que la course de démonstration est chargée : les alertes seraient fausses. Onglet CONFIG, bouton « Nouvelle course », puis revenez ici. Le bouton de test, lui, fonctionne dès maintenant.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"border-top:1px solid #2b3542;padding-top:12px;display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-size:11px;letter-spacing:0.14em;color:#7f8b99\">MESSAGES ENVOYÉS AUTOMATIQUEMENT<\u002Fdiv>\n            <sc-for list=\"{{ p.tg.opts }}\" as=\"o\" hint-placeholder-count=\"7\">\n              <button type=\"button\" sc-camel-on-click=\"{{ o.toggle }}\" style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;background:transparent;border:0;border-bottom:1px solid #1b222b;padding:8px 0;cursor:pointer;text-align:left;width:100%\">\n                <span style=\"font-size:15px;color:#e6ebf1\">{{ o.label }}<\u002Fspan>\n                <span style=\"font-size:11px;letter-spacing:0.12em;color:{{ o.col }}\">{{ o.mark }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #2b3542;padding-top:12px;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:11px;letter-spacing:0.14em;color:#7f8b99\">DERNIERS ENVOIS<\u002Fdiv>\n            <sc-for list=\"{{ p.tg.log }}\" as=\"l\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;gap:10px;font-size:13px\"><span style=\"color:#7f8b99;min-width:44px\">{{ l.t }}<\u002Fspan><span style=\"color:{{ l.col }}\">{{ l.text }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\"><span>RELAIS CLOUDFLARE (FACULTATIF, SI TELEGRAM EST BLOQUÉ)<\u002Fspan>\n            <input class=\"input\" type=\"text\" value=\"{{ p.tg.proxy }}\" sc-camel-on-change=\"{{ p.tg.setProxy }}\" placeholder=\"https://sodeba-apex....workers.dev\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">NOTIFICATIONS SUR CET APPAREIL<\u002Fdiv>\n          <div style=\"font-size:14px;color:#c3ccd6\">Autorisation : <strong>{{ p.alerts.permission }}<\u002Fstrong><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.alerts.ask }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757\">AUTORISER<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.alerts.test }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757\">TESTER<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #2b3542;padding-top:14px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:11px;letter-spacing:0.14em;color:#7f8b99\">RÉCAPITULATIF À ENVOYER<\u002Fdiv>\n            <pre style=\"margin:0;font-family:var(--font-body);font-size:15px;line-height:1.6;color:#e6ebf1;white-space:pre-wrap\">{{ p.alerts.recap }}<\u002Fpre>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.alerts.copy }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757;align-self:flex-start\">COPIER<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">Un envoi de SMS entièrement automatique, sans intervention, demande un serveur et un compte d’envoi payant. Ici tout part de cet appareil, en un clic.<\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabPrep }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;align-items:start\">\n        <section class=\"blueprint\" style=\"background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">DÉPART PROGRAMMÉ<\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\"><span>DATE ET HEURE DU DÉPART<\u002Fspan>\n            <input class=\"input\" type=\"datetime-local\" value=\"{{ p.prep.startInput }}\" sc-camel-on-change=\"{{ p.prep.setStart }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;font-family:var(--font-heading);font-size:20px\">\n          <\u002Flabel>\n          <div style=\"font-size:15px;color:#c3ccd6\">Départ {{ clock.startWall }} · arrivée {{ clock.endWall }}.<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:64px;line-height:0.9;color:#94bce3\">{{ p.prep.countdown }}<\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">FICHE DES PILOTES NOMINÉS<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">Trois pilotes différents, à remettre en direction de course avant 11 h le samedi. Sans cette fiche, l’équipe part en dernière position.<\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\"><span>QUALIFICATION Q1<\u002Fspan>\n            <input class=\"input\" type=\"text\" value=\"{{ p.nom.q1 }}\" sc-camel-on-change=\"{{ p.nom.setQ1 }}\" placeholder=\"Nom du pilote\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\"><span>SUPERPOLE Q2<\u002Fspan>\n            <input class=\"input\" type=\"text\" value=\"{{ p.nom.q2 }}\" sc-camel-on-change=\"{{ p.nom.setQ2 }}\" placeholder=\"Nom du pilote\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.12em;color:#7f8b99\"><span>DÉPART TYPE LE MANS<\u002Fspan>\n            <input class=\"input\" type=\"text\" value=\"{{ p.nom.start }}\" sc-camel-on-change=\"{{ p.nom.setStart }}\" placeholder=\"Nom du pilote\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1\"><\u002Flabel>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">POIDS MESURÉS AUX ESSAIS DU VENDREDI<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">Les essais libres 1 se courent sans lest, pour relever le poids réel de chaque pilote équipé. Saisissez ici la valeur relevée : elle passe le pilote de PROVISOIRE à CONFIRMÉ et fige le calcul de lest.<\u002Fdiv>\n          <sc-for list=\"{{ p.drivers }}\" as=\"d\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:12px;border-bottom:1px solid #1b222b;padding:7px 0\">\n              <span style=\"font-family:var(--font-heading);font-size:22px;min-width:90px\">{{ d.name }}<\u002Fspan>\n              <input class=\"input\" type=\"number\" step=\"0.5\" value=\"{{ d.w }}\" sc-camel-on-change=\"{{ d.setW }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;width:110px;font-family:var(--font-heading);font-size:20px\">\n              <span style=\"font-size:11px;letter-spacing:0.1em;color:{{ d.provCol }}\">{{ d.prov }}<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-size:13px;color:#7f8b99\">lest au plein<\u002Fspan>\n              <span style=\"font-family:var(--font-heading);font-size:22px;color:#94bce3\">{{ d.ballastFull }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabReg }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;align-items:start\">\n        <section class=\"blueprint\" style=\"background:#12171e;padding:18px;display:flex;flex-direction:column;gap:12px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">CE QUI NOUS CONCERNE · ROOKIE<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;font-size:15px\">\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#c3ccd6\">Poids total mini (kart + essence + pilote)<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:20px\">238 kg<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#c3ccd6\">Kart à vide · plein d’essence<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:20px\">162 kg · +7 kg<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#c3ccd6\">Lests fournis par le circuit<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:20px\">2,5 / 5 / 10 kg · 30 kg max<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#c3ccd6\">Relais maximum<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:20px\">45 min · pas de mini<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#c3ccd6\">Repos entre 2 relais d’un même pilote<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:20px\">1 h 20<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#c3ccd6\">Pilotage par pilote (équipe de 5 à 7)<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:20px\">40 min mini · 6 h maxi<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#c3ccd6\">Arrêt au stand<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:20px\">85 s mini<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#c3ccd6\">Vitesse dans les stands<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:20px\">15 km/h<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;padding:7px 0\"><span style=\"color:#c3ccd6\">Stop technique de nuit<\u002Fspan><span style=\"font-family:var(--font-heading);font-size:20px\">4 min · 1 h – 3 h<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">Les 45 min courent de la sortie des stands à la boucle d’entrée. Un arrêt de ravitaillement en cours de relais n’entre pas dans ce décompte. Pesée systématique du pilote et du kart à chaque sortie des stands.<\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e\">\n          <div style=\"padding:14px 16px;border-bottom:1px solid #2b3542;font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">PÉNALITÉS À NE PAS DÉCLENCHER<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:1px;background:#1b222b;font-size:14px\">\n            <div style=\"background:#12171e;padding:9px 12px;color:#c3ccd6\">Poids non conforme à la catégorie<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#ff4a3d\">Drive through au tour suivant, 85 s mini<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#c3ccd6\">Lest non fourni par le circuit<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#ff4a3d\">20 tours<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#c3ccd6\">Arrêt au stand de moins de 85 s<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#ff4a3d\">1 tour, puis 3 tours en cas de récidive<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#c3ccd6\">Temps de pilotage mini ou maxi non respecté<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#ff4a3d\">1 tour automatique<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#c3ccd6\">Défaut d’équipement<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#ff4a3d\">Stop and go de 85 s, sans ravitaillement<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#c3ccd6\">Vitesse excessive dans les stands<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#ff4a3d\">1 tour<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#c3ccd6\">Dépassement sous drapeau jaune<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#ff4a3d\">1 tour<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#c3ccd6\">Départ anticipé<\u002Fdiv>\n            <div style=\"background:#12171e;padding:9px 12px;color:#ff4a3d\">Stop and go de 85 s dans les 10 premiers tours<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">WEEK-END DU 11 AU 13 SEPTEMBRE 2026<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;font-size:15px\">\n            <div style=\"display:flex;gap:14px;padding:6px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#7f8b99;min-width:96px\">Ven 15h10<\u002Fspan><span>Essais libres 1, sans lest, pour évaluer les plombs par pilote<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;padding:6px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#7f8b99;min-width:96px\">Sam 8h45<\u002Fspan><span>Briefing général obligatoire<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;padding:6px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#7f8b99;min-width:96px\">Sam 11h00<\u002Fspan><span>Fiche des 3 pilotes nominés Q1, Q2 et départ à rendre<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;padding:6px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#7f8b99;min-width:96px\">Sam 11h20<\u002Fspan><span>Qualifications Q1 puis Superpole Q2<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;padding:6px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#7f8b99;min-width:96px\">Sam 14h30<\u002Fspan><span>Départ type Le Mans<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;padding:6px 0;border-bottom:1px solid #1b222b\"><span style=\"color:#7f8b99;min-width:96px\">Dim 1h – 3h<\u002Fspan><span>Stop technique obligatoire, appel dans l’ordre inverse du classement<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;padding:6px 0\"><span style=\"color:#7f8b99;min-width:96px\">Dim 14h30<\u002Fspan><span>Arrivée<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">Circuit International Karting du Mans, 1 395 m. Kart Sodikart, moteur Honda GX390. Radios interdites : panneautage depuis le muret, téléphone scotché au volant toléré.<\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabConfig }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;align-items:start\">\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">RÈGLEMENT ET PARAMÈTRES<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n            <sc-for list=\"{{ p.cfgFields }}\" as=\"f\" hint-placeholder-count=\"14\">\n              <label style=\"display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:0.1em;color:#7f8b99\"><span>{{ f.label }}<\u002Fspan>\n                <input class=\"input\" type=\"number\" step=\"0.5\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.set }}\" style=\"background:#0e1319;border-color:#2b3542;color:#e6ebf1;font-family:var(--font-heading);font-size:20px\">\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#7f8b99;line-height:1.5\">Aucune valeur n’est codée en dur : tous les calculs de lest, d’éligibilité et de stratégie lisent ces paramètres.<\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"border:1px solid #2b3542;background:#12171e;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">COURSE<\u002Fdiv>\n          <div style=\"font-size:14px;color:#c3ccd6;line-height:1.6\">Départ enregistré {{ clock.startWall }}, arrivée {{ clock.endWall }}. {{ clock.elapsed }} écoulées, {{ clock.remaining }} restantes. Les données sont sauvegardées automatiquement dans ce navigateur et restaurées au rafraîchissement.<\u002Fdiv>\n          <div style=\"border-top:1px solid #2b3542;padding-top:12px;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:11px;letter-spacing:0.14em;color:#7f8b99\">CALIBRATION DE LA CONSOMMATION<\u002Fdiv>\n            <div style=\"font-size:15px;color:#c3ccd6\">Mesurée sur {{ p.cal.n }} plein(s) complet(s) : <strong>{{ p.cal.value }}<\u002Fstrong> · valeur en usage {{ p.cal.current }}.<\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.cal.apply }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757;align-self:flex-start\">APPLIQUER LA VALEUR MESURÉE<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.io.json }}\" class=\"btn btn-secondary\" style=\"color:#e6ebf1;border-color:#3a4757\">EXPORTER LA COURSE<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ p.io.reset }}\" class=\"btn\" style=\"background:#ff4a3d;color:#0b0e12\">NOUVELLE COURSE (EFFACE LA DÉMO)<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabTests }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"border:1px solid #2b3542;background:#12171e\">\n        <div style=\"padding:14px 16px;border-bottom:1px solid #2b3542;font-family:var(--font-heading);font-size:20px;letter-spacing:0.12em\">SCÉNARIOS DE TEST · CALCULÉS PAR LE MOTEUR RÉEL<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.4fr 1.2fr 1.6fr 0.7fr;gap:1px;background:#222b36;font-size:11px;letter-spacing:0.1em;color:#7f8b99\">\n          <div style=\"background:#0e1319;padding:8px 10px\">SCÉNARIO<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">ATTENDU<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">RÉSULTAT DE L’APPLICATION<\u002Fdiv>\n          <div style=\"background:#0e1319;padding:8px 10px\">VERDICT<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.4fr 1.2fr 1.6fr 0.7fr;gap:1px;background:#1b222b;font-size:15px\">\n          <sc-for list=\"{{ p.tests }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"background:#12171e;padding:10px 12px\">{{ t.label }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:10px 12px;color:#c3ccd6\">{{ t.expect }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:10px 12px\">{{ t.got }}<\u002Fdiv>\n            <div style=\"background:#12171e;padding:10px 12px;color:{{ t.col }};font-family:var(--font-heading);font-size:19px\">{{ t.verdict }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;PIT WALL&quot;,&quot;PIT CREW&quot;],&quot;default&quot;:&quot;PIT WALL&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Affichage&quot;},&quot;prepMin&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:35,&quot;min&quot;:20,&quot;max&quot;:44,&quot;unit&quot;:&quot;min&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Seuils d'alerte relais&quot;},&quot;warnMin&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;min&quot;:25,&quot;max&quot;:45,&quot;unit&quot;:&quot;min&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Seuils d'alerte relais&quot;}}\">\nconst GREEN = '#3ad07d', ORANGE = '#ffa03c', RED = '#ff4a3d', STEEL = '#94bce3', MUTED = '#7f8b99', INK = '#e6ebf1';\nconst LSK = 'sodeba_pitwall_v1';\n\nclass Component extends DCLogic {\n  state = Component.boot();\n\n  static rng(seed) { let x = seed; return () => { x = (x * 1103515245 + 12345) % 2147483648; return x / 2147483648; }; }\n\n  static boot() {\n    let s = null;\n    try { const r = localStorage.getItem(LSK); if (r) s = JSON.parse(r); } catch (e) { }\n    if (!s || !s.cfg) s = Component.demo();\n    s.cfg.minDriveMin = s.cfg.minDriveMin == null ? 40 : s.cfg.minDriveMin;\n    s.cfg.techFrom = s.cfg.techFrom == null ? 1 : s.cfg.techFrom;\n    s.cfg.techTo = s.cfg.techTo == null ? 3 : s.cfg.techTo;\n    if (s.techDone == null) s.techDone = false;\n    s.penalties = s.penalties || [];\n    s.weighings = s.weighings || [];\n    s.nominations = s.nominations || { q1: '', q2: '', start: '' };\n    s.night = !!s.night;\n    s.sound = s.sound !== false;\n    s.board = s.board || 'BOX';\n    s.plan = s.plan || null;\n    s.simLen = s.simLen || s.cfg.stintMax;\n    s.notifMin = s.notifMin == null ? 20 : s.notifMin;\n    s.myDriver = s.myDriver || null;\n    s.drivers.forEach(d => { if (d.tel == null) d.tel = ''; });\n    s.tg = s.tg || { token: '', chat: '', on: false, proxy: '', log: [], status: 'NON CONFIGURÉ' };\n    s.tg.log = s.tg.log || [];\n    s.sent = s.sent || {};\n    s.tgOpts = s.tgOpts || { prepare: true, recap: true, rank: true, refuel: true, overrun: true, weight: true, tech: true };\n    s.rev = s.rev || 0;\n    s.now = Date.now();\n    s.tab = s.tab || 'dash';\n    if (!s.view) s.view = 'wall';\n    return s;\n  }\n\n  static demo() {\n    const cfg = { kart: 162, fuelFull: 7, minW: 238, stintMax: 45, pitMin: 85, restMin: 80, maxDriverH: 6, minDriveMin: 40, refuelEvery: 3, step: 2.5, ballastMax: 30, safety: 1, conso: 3.1, techSec: 240, techFrom: 1, techTo: 3, durationH: 24, start: 0 };\n    const drivers = [\n      { id: 'v', name: 'Victor', w: 56, prov: false, note: '' },\n      { id: 'c', name: 'Clovis', w: 72, prov: true, note: '' },\n      { id: 'h', name: 'Hervé', w: 78, prov: true, note: '' },\n      { id: 'a', name: 'Amaury', w: 60, prov: false, note: '' },\n      { id: 'd', name: 'Didier', w: 82, prov: true, note: '' }\n    ];\n    const rotation = ['v', 'c', 'h', 'a', 'd'];\n    const base = { v: 62.8, c: 64.6, h: 65.4, a: 63.4, d: 66.1 };\n    const now = Date.now();\n    const start = now - (7 * 3600 + 12 * 60) * 1000;\n    cfg.start = start;\n    const rnd = Component.rng(20260909);\n    const stints = [], laps = [];\n    let t = start, fuel = cfg.fuelFull, since = 0, idx = 0, id = 1;\n    for (let guard = 0; guard < 60; guard++) {\n      const dId = rotation[idx % rotation.length];\n      const dw = drivers.find(d => d.id === dId).w;\n      const need = cfg.minW + cfg.safety - cfg.kart - fuel - dw;\n      const ballast = Math.min(cfg.ballastMax, Math.max(0, Math.ceil(need / cfg.step) * cfg.step));\n      const dur = (41 + Math.floor(rnd() * 5)) * 60000;\n      const open = (t + dur) > (now - 60000);\n      const st = { id: id++, dId: dId, out: t, in: open ? null : t + dur, fuelStart: Math.round(fuel * 100) / 100, ballast: ballast, pitSec: null, refuelAfter: false, tech: false };\n      const span = open ? (now - t) : dur;\n      let lt = t, n = 0;\n      while (lt - t < span - 30000 && n < 60) {\n        const l = base[dId] + (n * 0.035) + rnd() * 0.9;\n        laps.push({ s: st.id, d: dId, n: n + 1, ms:
