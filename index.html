 ; une fenêtre qui trouve une révision plus récente l'adopte au\n   * lieu d'écrire par-dessus. */\n  componentDidUpdate() {\n    if (!this._dirty) return;\n    this._dirty = false;\n    try {\n      const raw = localStorage.getItem(LSK);\n      if (raw) {\n        const stored = JSON.parse(raw);\n        if ((stored.rev || 0) > (this.state.rev || 0)) { this.adopt(stored); return; }\n      }\n      const c = Object.assign({}, this.state);\n      delete c.now;\n      localStorage.setItem(LSK, JSON.stringify(c));\n    } catch (e) { }\n  }\n  adopt(stored) {\n    stored.now = Date.now();\n    this._dirty = false;\n    this.setState(stored);\n  }\n\n  up(fn) {\n    this.setState(s => {\n      const n = Object.assign({}, s);\n      fn(n);\n      n.rev = (n.rev || 0) + 1;\n      return n;\n    });\n    this._dirty = true;\n  }\n\n  /* ---------- formatters ---------- */\n  static hms(ms) {\n    if (ms == null || isNaN(ms)) return '—';\n    const s = Math.max(0, Math.floor(ms / 1000));\n    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), q = s % 60;\n    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(q).padStart(2, '0');\n  }\n  static ms(ms) {\n    if (ms == null || isNaN(ms)) return '—';\n    const s = Math.max(0, Math.floor(ms / 1000));\n    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');\n  }\n  static lap(ms) { if (!ms) return '—'; return Math.floor(ms / 60000) + ':' + (Math.floor((ms % 60000) / 1000)).toString().padStart(2, '0') + '.' + Math.floor((ms % 1000) / 10).toString().padStart(2, '0'); }\n  static wall(t) { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }\n  static kg(v) { return (Math.round(v * 10) / 10).toFixed(1); }\n\n  /* ---------- model ---------- */\n  drv(id) { return this.state.drivers.find(d => d.id === id) || { name: '—', w: 0 }; }\n  cur() { const s = this.state.stints; return s.length ? s[s.length - 1] : null; }\n  ballastFor(dw, fuel) {\n    const c = this.state.cfg;\n    const need = c.minW + c.safety - c.kart - fuel - dw;\n    return Math.min(c.ballastMax, Math.max(0, Math.ceil(need / c.step) * c.step));\n  }\n  fuelNow() {\n    const c = this.state.cfg, st = this.cur(), now = this.state.now;\n    if (!st) return { kg: c.fuelFull, src: 'ESTIMÉE' };\n    const m = this.state.fuelMeas;\n    if (m && m.stint === st.id) {\n      const kg = Math.max(0, m.kg - c.conso * Math.max(0, now - m.at) / 3600000);\n      return { kg, src: now - m.at < 60000 ? 'SAISIE' : 'SAISIE + ESTIMÉE' };\n    }\n    const kg = Math.max(0, st.fuelStart - c.conso * Math.max(0, now - st.out) / 3600000);\n    return { kg, src: 'ESTIMÉE' };\n  }\n  netMs(st, at) {\n    if (!st) return 0;\n    const end = st.in || at;\n    let p = st.pauseMs || 0;\n    if (st.pauseStart) p += (st.in ? st.in : at) - st.pauseStart;\n    return Math.max(0, end - st.out - p);\n  }\n  penaltyLaps() { return this.state.penalties.reduce((a, b) => a + (b.laps || 0), 0); }\n  driverStats(id) {\n    const s = this.state, now = s.now;\n    const mine = s.stints.filter(x => x.dId === id);\n    let total = 0, lastEnd = null;\n    mine.forEach(x => { const end = x.in || now; total += this.netMs(x, now); if (!lastEnd || end > lastEnd) lastEnd = end; });\n    const open = mine.some(x => !x.in);\n    const laps = s.laps.filter(l => l.d === id).map(l => l.ms).sort((a, b) => a - b);\n    const avg = laps.length ? laps.reduce((a, b) => a + b, 0) / laps.length : null;\n    const med = laps.length ? laps[Math.floor(laps.length / 2)] : null;\n    const rest = open ? 0 : (lastEnd ? now - lastEnd : Infinity);\n    return { total, stints: mine.length, lastEnd, rest, open, best: laps[0] || null, avg, med, lapCount: laps.length };\n  }\n  eligibility(id) {\n    const c = this.state.cfg, st = this.driverStats(id);\n    const maxMs = c.maxDriverH * 3600000;\n    if (st.open) return { code: 'EN PISTE', col: STEEL, ok: false, why: 'Ce pilote est actuellement en piste.' };\n    if (st.total + c.stintMax * 60000 > maxMs) return { code: 'RISQUE 6H', col: RED, ok: false, why: 'Un relais complet le porterait à ' + Component.hms(st.total + c.stintMax * 60000) + ' sur les ' + c.maxDriverH + ' h autorisées.' };\n    if (st.rest < c.restMin * 60000) return { code: 'REPOS INSUFFISANT', col: RED, ok: false, why: 'Repos ' + Component.ms(st.rest) + ' contre ' + c.restMin + ' min exigées — éligible dans ' + Component.ms(c.restMin * 60000 - st.rest) + '.' };\n    return { code: 'PRÊT', col: GREEN, ok: true, why: 'Repos ' + Component.hms(st.rest) + ', total piloté ' + Component.hms(st.total) + '.' };\n  }\n  nextDriverId() {\n    const s = this.state, cur = this.cur();\n    if (s.forcedNext) return s.forcedNext;\n    const rot = s.rotation;\n    const i = cur ? rot.indexOf(cur.dId) : -1;\n    return rot[(i + 1) % rot.length];\n  }\n  stintsSinceRefuel() {\n    const s = this.state.stints;\n    let n = 0;\n    for (let i = s.length - 1; i >= 0; i--) { if (s[i].refuelAfter && i < s.length - 1) break; n++; }\n    return n;\n  }\n  refuelDue() { return this.stintsSinceRefuel() >= this.state.cfg.refuelEvery; }\n\n  /* ---------- moteurs ---------- */\n  buildPlan(fromNow, stintLen) {\n    const s = this.state, c = s.cfg;\n    const len = (stintLen || c.stintMax) * 60000;\n    const raceEnd = c.start + c.durationH * 3600000;\n    const tot = {}, lastEnd = {};\n    s.drivers.forEach(d => { tot[d.id] = 0; lastEnd[d.id] = c.start - c.restMin * 60000; });\n    let t = c.start, no = 1, since = 0;\n    if (fromNow) {\n      s.stints.forEach(x => { tot[x.dId] = (tot[x.dId] || 0) + this.netMs(x, s.now); lastEnd[x.dId] = x.in || s.now; });\n      const cur = this.cur();\n      t = cur ? (cur.in || cur.out + len) + c.pitMin * 1000 : s.now;\n      no = (cur ? cur.id : 0) + 1;\n      since = this.stintsSinceRefuel();\n    }\n    const rows = [], viol = [];\n    for (let g = 0; g < 60 && t < raceEnd; g++) {\n      const dur = Math.min(len, raceEnd - t);\n      let cands = s.drivers.filter(d => (t - lastEnd[d.id]) >= c.restMin * 60000 && (tot[d.id] + dur) <= c.maxDriverH * 3600000);\n      let forced = false;\n      if (!cands.length) { cands = s.drivers.slice(); forced = true; }\n      cands.sort((a, b) => (tot[a.id] - tot[b.id]) || (lastEnd[a.id] - lastEnd[b.id]));\n      const d = cands[0];\n      const refuel = since >= c.refuelEvery;\n      if (refuel) since = 0;\n      if (forced) viol.push('Relais ' + no + ' : aucun pilote éligible, ' + d.name + ' retenu par défaut.');\n      rows.push({ no: no, id: d.id, name: d.name, at: t, dur: dur, refuel: refuel });\n      tot[d.id] += dur; lastEnd[d.id] = t + dur; since++; no++;\n      t += dur + c.pitMin * 1000;\n    }\n    s.drivers.forEach(d => {\n      if (tot[d.id] < c.minDriveMin * 60000) viol.push(d.name + ' finirait à ' + Component.hms(tot[d.id]) + ', sous le minimum de ' + c.minDriveMin + ' min.');\n      if (tot[d.id] > c.maxDriverH * 3600000) viol.push(d.name + ' dépasserait les ' + c.maxDriverH + ' h (' + Component.hms(tot[d.id]) + ').');\n    });\n    return { rows: rows, tot: tot, viol: viol, end: t };\n  }\n  calibrate() {\n    const s = this.state, c = s.cfg;\n    let segs = [], acc = 0, started = false;\n    s.stints.forEach(st => {\n      if (!st.in) return;\n      acc += this.netMs(st, s.now);\n      started = true;\n      if (st.refuelAfter && started) { segs.push(acc); acc = 0; }\n    });\n    if (!segs.length) return null;\n    const hours = segs.reduce((a, b) => a + b, 0) / 3600000;\n    return { conso: c.fuelFull * segs.length / hours, n: segs.length };\n  }\n  addWeighing(kg) {\n    const v = parseFloat(String(kg).replace(',', '.'));\n    if (isNaN(v)) return;\n    this.up(s => {\n      const st = s.stints[s.stints.length - 1];\n      const d = s.drivers.find(x => x.id === (st || {}).dId) || { w: 0 };\n      const f = this.fuelNow().kg;\n      const computed = s.cfg.kart + f + d.w + (st ? st.ballast : 0);\n      s.weighings.push({ at: Date.now(), stint: st ? st.id : null, kg: v, computed: Math.round(computed * 10) / 10, driver: d.name });\n    });\n  }\n  recalFuel() {\n    const s = this.state, w = s.weighings[s.weighings.length - 1];\n    if (!w) return;\n    this.up(x => {\n      const st = x.stints[x.stints.length - 1];\n      const d = x.drivers.find(y => y.id === (st || {}).dId) || { w: 0 };\n      const fuel = Math.max(0, w.kg - x.cfg.kart - d.w - (st ? st.ballast : 0));\n      x.fuelMeas = { kg: Math.round(fuel * 10) / 10, at: w.at, stint: st ? st.id : null };\n      x.notes.push({ at: Date.now(), text: 'Essence recalée à ' + Component.kg(fuel) + ' kg d\\u2019après la pesée balance de ' + Component.kg(w.kg) + ' kg' });\n    });\n  }\n  /* ---------- Telegram ---------- */\n  tgSend(text, key, force) {\n    const tg = this.state.tg;\n    if (!tg || !tg.token || !tg.chat) return;\n    if (!force && !tg.on) return;\n    if (key) {\n      if (this.state.sent[key]) return;\n      this.up(s => { s.sent[key] = Date.now(); });\n    }\n    const body = JSON.stringify({ chat_id: tg.chat, text: text, disable_web_page_preview: true });\n    const url = tg.proxy\n      ? tg.proxy.replace(/\\/$/, '') + '/telegram'\n      : 'https://api.telegram.org/bot' + tg.token + '/sendMessage';\n    const payload = tg.proxy ? JSON.stringify({ chat_id: tg.chat, text: text }) : body;\n    fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: payload })\n      .then(r => r.json().catch(() => ({ ok: r.ok })))\n      .then(j => this.up(s => {\n        s.tg.status = j && j.ok === false ? 'REFUSÉ : ' + ((j.description) || 'voir jeton ou groupe') : 'ENVOYÉ';\n        s.tg.log.unshift({ at: Date.now(), text: text.split('\\n')[0], ok: !(j && j.ok === false) });\n        s.tg.log = s.tg.log.slice(0, 20);\n      }))\n      .catch(() => this.up(s => {\n        s.tg.status = 'ÉCHEC RÉSEAU';\n        s.tg.log.unshift({ at: Date.now(), text: text.split('\\n')[0], ok: fals .join('') + '<\u002Ftr>').join('') + '<\u002Ftable>'),\n        pdf: () => window.print(),\n        json: () => this.download('sodeba-24h-course.json', 'application/json', JSON.stringify(this.state)),\n        reset: () => { if (confirm('Effacer la course en cours et repartir à zéro ?')) this.up(x => { const f = Component.demo(); x.stints = [{ id: 1, dId: x.rotation[0], out: Date.now(), in: null, fuelStart: x.cfg.fuelFull, ballast: this.ballastFor(this.drv(x.rotation[0]).w, x.cfg.fuelFull), pitSec: null, refuelAfter: false, tech: false, laps: 0 }]; x.laps = []; x.notes = []; x.demo = false; x.cfg.start = Date.now(); x.fuelMeas = null; x.pitStartedAt = null; }); },\n        noteText: s.noteText || '',\n        setNote: e => this.up(x => { x.noteText = e.target.value; }),\n        addNote: () => { this.addNote(this.state.noteText); this.up(x => { x.noteText = ''; }); }\n      },\n      pitActions: {\n        withFuel: () => this.pitOut(true),\n        without: () => this.pitOut(false),\n        tech: () => this.up(x => { x.pitStartedAt = Date.now(); x.techDone = true; x.notes.push({ at: Date.now(), text: 'Arrêt technique obligatoire de nuit (' + x.cfg.techSec + ' s, sans ravitaillement ni changement de pilote, 2 pneus avant neufs)' }); })\n      }\n    };\n  }\n\n  tryApex() {\n    const url = this.state.apex.url;\n    if (!url) { this.up(s => { s.apex.status = 'AUCUNE URL'; }); return; }\n    if (this._apexBusy) return;\n    this._apexBusy = true;\n    setTimeout(() => { this._apexBusy = false; }, 8000);\n    this.up(s => { s.apex.status = 'TENTATIVE…'; });\n    fetch(url, { cache: 'no-store' }).then(r => r.json()).then(j => {\n      this.up(s => {\n        s.apex.lastTry = Date.now();\n        s.apex.status = j && j.ok === false ? 'RELAIS OK, PAS DE DONNÉE' : 'CONNECTÉ';\n        if (j && j.ok === false) { s.apex.reason = j.reason || ''; return; }\n        s.apex.reason = '';\n        s.feed = j;\n        if (j && typeof j === 'object') {\n          if (j.position != null) s.live.pos = j.position;\n          if (j.gapLeader != null) s.live.gapLeader = String(j.gapLeader);\n          if (j.gapAhead != null) s.live.gapAhead = String(j.gapAhead);\n          if (j.gapBehind != null) s.live.gapBehind = String(j.gapBehind);\n          if (j.positionCategory != null) s.live.posCat = j.positionCategory;\n          s.live.src = 'PROXY APEX';\n          s.live.at = Date.now();\n          const st = s.stints[s.stints.length - 1];\n          if (j.status === 'PIT' && st && !st.in) { st.in = Date.now(); s.pitStartedAt = Date.now(); }\n        }\n      });\n    }).catch(() => this.up(s => { s.apex.status = 'ÉCHEC — MODE MANUEL'; s.apex.lastTry = Date.now(); }));\n  }\n\n  /* ---------- render ---------- */\n  renderVals() {\n    const s = this.state, c = s.cfg, now = s.now;\n    const cur = this.cur();\n    const raceEnd = c.start + c.durationH * 3600000;\n    const fuel = this.fuelNow();\n\n    /* current stint */\n    const elBrut = cur ? now - cur.out : 0;\n    const el = cur ? this.netMs(cur, now) : 0;\n    const elMin = el / 60000;\n    let curCol = GREEN, curAnim = 'none';\n    const warnMin = this.props.warnMin ?? 40, prepMin = this.props.prepMin ?? 35;\n    if (elMin >= c.stintMax) { curCol = RED; curAnim = 'sodebaPulse 0.9s infinite'; }\n    else if (elMin >= c.stintMax - 2) curCol = RED;\n    else if (elMin >= warnMin) curCol = ORANGE;\n    else if (elMin >= prepMin) curCol = ORANGE;\n    const curLaps = s.laps.filter(l => cur && l.s === cur.id);\n    const curAvg = curLaps.length ? curLaps.reduce((a, b) => a + b.ms, 0) / curLaps.length : null;\n    const curBest = curLaps.length ? Math.min.apply(null, curLaps.map(l => l.ms)) : null;\n\n    /* next driver */\n    const nid = this.nextDriverId();\n    const nd = this.drv(nid), nst = this.driverStats(nid), nel = this.eligibility(nid);\n    const nextBallast = this.ballastFor(nd.w, this.refuelDue() ? c.fuelFull : fuel.kg);\n\n    /* weight now */\n    const cd = cur ? this.drv(cur.dId) : { w: 0, name: '—' };\n    const total = c.kart + fuel.kg + cd.w + (cur ? cur.ballast : 0);\n    const marge = total - c.minW;\n    const wCol = marge < 0 ? RED : (marge < 2 ? ORANGE : GREEN);\n\n    /* fuel strategy */\n    const since = this.stintsSinceRefuel();\n    const inStints = Math.max(0, c.refuelEvery - since);\n    const lastRefuelStint = (function (st) { for (let i = st.length - 1; i >= 0; i--) if (st[i].refuelAfter && i < st.length - 1) return st[i + 1]; return st[0]; })(s.stints);\n    const sinceMs = lastRefuelStint ? now - lastRefuelStint.out : 0;\n    const etaRefuel = cur ? cur.out + (inStints === 0 ? 0 : (inStints - 1) * (c.stintMax * 60000 + c.pitMin * 1000)) + c.stintMax * 60000 : now;\n    const fuelWarn = inStints === 0 || (inStints === 1 && (cur ? (c.stintMax * 60000 - el) < 10 * 60000 : false));\n\n    /* pit stop */\n    const pitEl = s.pitStartedAt ? Math.floor((now - s.pitStartedAt) / 1000) : null;\n    const pitLeft = pitEl == null ? c.pitMin : Math.max(0, c.pitMin - pitEl);\n    const pitOpen = pitEl != null && pitEl >= c.pitMin;\n    const pitFuel = this.refuelDue() ? c.fuelFull : fuel.kg;\n    const pitTotal = c.kart + pitFuel + nd.w + nextBallast;\n    const pitMarge = pitTotal - c.minW;\n    const curBallast = cur ? cur.ballast : 0;\n    const dB = Math.round((nextBallast - curBallast) * 10) / 10;\n\n    /* recommendations */\n    const recos = [];\n    if (elMin >= c.stintMax) recos.push({ col: RED, title: 'RENTRER IMMÉDIATEMENT', why: 'Le relais dépasse la limite de ' + c.stintMax + ' min (' + Component.ms(el) + ' écoulées). Toute minute supplémentaire expose à une pénalité.' });\n    else if (elMin >= 40) recos.push({ col: ORANGE, title: 'PRÉPARER ' + nd.name.toUpperCase() + ' MAINTENANT', why: nd.name + ' doit être casqué : ' + this.drv(cur ? cur.dId : nid).name + ' atteindra ' + c.stintMax + ' min dans ' + Component.ms(Math.max(0, c.stintMax * 60000 - el)) + '.' });\n    else recos.push({ col: GREEN, title: 'CONTINUER LE RELAIS', why: this.drv(cur ? cur.dId : nid).name + ' roule depuis ' + Component.ms(el) + '. Changement prévu dans ' + Component.ms(Math.max(0, c.stintMax * 60000 - el)) + ', ' + nd.name + ' à préparer 5 min avant.' });\n    if (this.refuelDue()) recos.push({ col: ORANGE, title: 'PLEIN AU PROCHAIN ARRÊT', why: since + ' relais depuis le dernier plein (règle : tous les ' + c.refuelEvery + '). Essence estimée à bord ' + Component.kg(fuel.kg) + ' kg.' });\n    else recos.push({ col: GREEN, title: 'PAS DE PLEIN AU PROCHAIN ARRÊT', why: 'Plein prévu dans ' + inStints + ' relais, soit vers ' + Component.wall(etaRefuel) + '.' });\n    if (!nel.ok) recos.push({ col: RED, title: 'CHANGER L\\u2019ORDRE DES PILOTES', why: nd.name + ' : ' + nel.why + ' Utiliser « pilote suivant » pour décaler la rotation.' });\n    if (marge < 0) recos.push({ col: RED, title: 'CORRIGER LE LEST AVANT SORTIE', why: 'Poids total estimé ' + Component.kg(total) + ' kg pour un minimum de ' + c.minW + ' kg. Ajouter ' + Component.kg(this.ballastFor(cd.w, fuel.kg) - curBallast) + ' kg de lest.' });\n\n    /* stop technique de nuit + temps mini de pilotage */\n    const hr = new Date(now).getHours();\n    const techWindow = hr >= c.techFrom && hr < c.techTo;\n    if (techWindow && !s.techDone) recos.push({ col: ORANGE, title: 'STOP TECHNIQUE OBLIGATOIRE', why: 'Fenêtre ' + c.techFrom + 'h–' + c.techTo + 'h : appel dans l\\u2019ordre inverse du classement. ' + (c.techSec / 60) + ' min, sans ravitaillement ni changement de pilote, 2 pneus avant neufs.' });\n    const shortDrivers = s.drivers.filter(d => this.driverStats(d.id).total < c.minDriveMin * 60000);\n    const hoursLeft = (raceEnd - now) / 3600000;\n    if (shortDrivers.length && hoursLeft < shortDrivers.length * 1.5) recos.push({ col: shortDrivers.length * (c.minDriveMin / 60) > hoursLeft ? RED : ORANGE, title: 'TEMPS MINIMUM DE PILOTAGE', why: shortDrivers.map(d => d.name).join(', ') + ' sous les ' + c.minDriveMin + ' min imposées. Un tour de pénalité par pilote concerné à l\\u2019arrivée.' });\n\n    /* banner + alerts */\n    const chips = [];\n    if (techWindow && !s.techDone) chips.push({ label: 'STOP TECHNIQUE À FAIRE', col: ORANGE });\n    if (shortDrivers.length && hoursLeft < 4) chips.push({ label: 'TEMPS MINI PILOTE', col: ORANGE });\n    if (elMin >= c.stintMax) chips.push({ label: 'RELAIS > ' + c.stintMax + ' MIN', col: RED });\n    else if (elMin >= 40) chips.push({ label: 'RELAIS > 40 MIN', col: ORANGE });\n    if (marge < 0) chips.push({ label: 'SOUS-POIDS', col: RED });\n    else if (marge < 2) chips.push({ label: 'MARGE POIDS FAIBLE', col: ORANGE });\n    if (!nel.ok) chips.push({ label: nel.code, col: RED });\n    if (this.refuelDue()) chips.push({ label: 'PLEIN AU PROCHAIN ARRÊT', col: ORANGE });\n    const worst = chips.some(x => x.col === RED) ? RED : (chips.length ? ORANGE : GREEN);\n    const provisional = s.drivers.filter(d => d.prov).map(d => d.name);\n\n    const tabDefs = [['dash', 'DASHBOARD'], ['relais', 'RELAIS'], ['pilotes', 'PILOTES'], ['poids', 'POIDS & LEST'], ['essence', 'ESSENCE'], ['pit', 'PIT STOP'], ['ingenieur', 'INGÉNIEUR'], ['simu', 'SIMULATEUR'], ['alertes', 'ALERTES'], ['journal', 'JOURNAL'], ['prep', 'PRÉ-COURSE'], ['reglement', 'RÈGLEMENT'], ['config', 'CONFIG'], ['tests', 'TESTS']];\n\n    return {\n      isWall: s.view === 'wall', isCrew: s.view === 'crew',\n      tabDash: s.view === 'wall' && s.tab === 'dash',\n      setWall: () => this.up(x => { x.view = 'wall'; }),\n      setCrew: () => this.up(x => { x.view = 'crew'; }),\n      tabs: tabDefs.map(t => ({\n        label: t[1], set: () => this.up(x => { x.tab = t[0]; }),\n        bg: s.tab === t[0] ? '#12171e' : 'transparent',\n        fg: s.tab === t[0] ? INK : MUTED,\n        mark: s.tab === t[0] ? STEEL : 'transparent'\n      })),\n      cfgv: c,\n      clock: {\n        elapsed: Component.hms(now - c.start), remaining: Component.hms(raceEnd - now), wall: Component.wall(now),\n        startWall: new Date(c.start).toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: '2-digit' }) + ' à ' + Component.wall(c.start),\n        endWall: new Date(raceEnd).toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: '2-digit' }) + ' à ' + Component.wall(raceEnd)\n      },\n      banner: {\n        bg: worst === RED ? '#2a0f0d' : (worst === ORANGE ? '#231a09' : '#0e1319'),\n        fg: worst, title: worst === RED ? 'ALERTE ROUGE' : (worst === ORANGE ? 'VIGILANCE' : 'TOUT EST OK'),\n        text: (s.demo ? 'Données de démonstration — remettre à zéro dans CONFIG avant la course. ' : '') + (provisional.length ? 'Poids provisoires à confirmer : ' + provisional.join(', ') + '.' : ''),\n        chips: chips\n      },\n      live: {\n        pos: 'P' + s.live.pos, posCat: 'P' + s.live.posCat,\n        status: cur && !cur.in ? 'PISTE' : (s.pitStartedAt ? 'PIT' : 'STOP'),\n        statusCol: cur && !cur.in ? GREEN : ORANGE,\n        cells: (function (f) {\n          const fresh = f && s.live.at && (now - s.live.at) < 90000;\n          const fx = fresh ? 'LIVE APEX' : null;\n          const fcol = fresh ? GREEN : ORANGE;\n          const dem = s.demo ? 'DÉMO' : 'CALCULÉ APP';\n          return [\n            { label: 'TOURS TOTAL', value: fresh && f.laps != null ? String(f.laps) : String(s.laps.length), src: fx || dem, srcCol: fresh ? GREEN : MUTED },\n            { label: 'DERNIER TOUR', value: fresh && f.lastLap ? f.lastLap : Component.lap(s.laps.length ? s.laps[s.laps.length - 1].ms : null), src: fx || dem, srcCol: fcol },\n            { label: 'MEILLEUR TOUR', value: fresh && f.bestLap ? f.bestLap : Component.lap(s.laps.length ? Math.min.apply(null, s.laps.map(l => l.ms)) : null), src: fx || dem, srcCol: fcol },\n            { label: 'ÉCART LEADER', value: s.live.gapLeader, src: s.live.src, srcCol: fcol },\n            { label: 'ÉCART DEVANT', value: s.live.gapAhead, src: s.live.src, srcCol: fcol },\n            { label: 'ÉCART DERRIÈRE', value: s.live.gapBehind, src: s.live.src, srcCol: fcol }\n          ];\n        })(s.feed)\n      },\n      cur: {\n        no: cur ? cur.id : 0, name: cd.name ? cd.name.toUpperCase() : '—',\n        elapsed: Component.ms(el), left: Component.ms(Math.max(0, c.stintMax * 60000 - el)),\n        pct: Math.min(100, (el / (c.stintMax * 60000)) * 100).toFixed(1) + '%',\n        col: curCol, anim: curAnim, outAt: cur ? Component.wall(cur.out) : '—',\n        laps: String(curLaps.length), avg: Component.lap(curAvg), best: Component.lap(curBest)\n      },\n      next: {\n        name: nd.name ? nd.name.toUpperCase() : '—', status: nel.code, col: nel.col, why: nel.why,\n        weight: nd.w, cells: [\n          { label: 'REPOS ACTUEL', value: nst.open ? 'EN PISTE' : Component.hms(nst.rest), col: nel.ok ? GREEN : ORANGE },\n          { label: 'ÉLIGIBLE DANS', value: nst.rest >= c.restMin * 60000 ? 'MAINTENANT' : Component.ms(c.restMin * 60000 - nst.rest), col: INK },\n          { label: 'POIDS PILOTE', value: nd.w + ' kg', col: nd.prov ? ORANGE : INK },\n          { label: 'LEST PRÉVU', value: Component.kg(nextBallast) + ' kg', col: STEEL },\n          { label: 'TOTAL PILOTÉ', value: Component.hms(nst.total), col: INK },\n          { label: 'AVANT 6 H', value: Component.hms(c.maxDriverH * 3600000 - nst.total), col: (c.maxDriverH * 3600000 - nst.total) < 45 * 60000 ? ORANGE : INK }\n        ]\n      },\n      wt: {\n        total: Component.kg(total), col: wCol, src: fuel.src, srcCol: ORANGE,\n        fuelKg: Component.kg(fuel.kg) + ' kg',\n        margeLabel: marge < 0 ? 'SOUS-POIDS ' + Component.kg(marge) + ' KG' : 'MARGE +' + Component.kg(marge) + ' KG',\n        under: marge < 0,\n        cells: [\n          { label: 'KART À VIDE', value: c.kart + ' kg' },\n          { label: 'ESSENCE ' + fuel.src, value: Component.kg(fuel.kg) + ' kg' },\n          { label: 'PILOTE ' + (cd.name || '').toUpperCase(), value: cd.w + ' kg' },\n          { label: 'LEST INSTALLÉ', value: Component.kg(curBallast) + ' kg' }\n        ]\n      },\n      fuelS: {\n        inStints: String(inStints), col: fuelWarn ? ORANGE : GREEN, warn: fuelWarn,\n        nextRefuel: this.refuelDue() ? 'OUI' : 'NON',\n        crewLine: this.refuelDue() ? 'Ravitaillement complet — ' + c.fuelFull + ' kg' : 'Prochain plein dans ' + inStints + ' relais',\n        cells: [\n          { label: 'RELAIS DEPUIS PLEIN', value: since + ' / ' + c.refuelEvery, col: INK },\n          { label: 'TEMPS DEPUIS PLEIN', value: Component.hms(sinceMs), col: INK },\n          { label: 'PROCHAIN PLEIN VERS', value: Component.wall(etaRefuel), col: STEEL },\n          { label: 'ESSENCE À BORD', value: Component.kg(fuel.kg) + ' kg ' + fuel.src, col: ORANGE }\n        ]\n      },\n      pit: {\n        chrono: pitEl == null ? String(c.pitMin) : String(pitLeft),\n        chronoCol: pitEl == null ? MUTED : (pitOpen ? GREEN : RED),\n        gate: pitEl == null ? 'CHRONO À L\\u2019ARRÊT' : (pitOpen ? 'SORTIE AUTORISÉE' : 'NE PAS SORTIR'),\n        anim: pitEl != null && !pitOpen ? 'sodebaPulse 0.9s infinite' : 'none',\n        outBg: pitOpen ? GREEN : '#3a4757',\n        ballastDelta: dB === 0 ? 'INCHANGÉ' : (dB > 0 ? '+' + Component.kg(dB) + ' kg' : Component.kg(dB) + ' kg'),\n        ballastFinal: Component.kg(nextBallast),\n        totalW: Component.kg(pitTotal), wCol: pitMarge < 0 ? RED : (pitMarge < 2 ? ORANGE : GREEN),\n        margeLabel: pitMarge < 0 ? 'SOUS-POIDS ' + Component.kg(pitMarge) + ' kg' : 'Marge +' + Component.kg(pitMarge) + ' kg'\n      },\n      recos: recos,\n      tabRelais: s.view === 'wall' && s.tab === 'relais',\n      tabPilotes: s.view === 'wall' && s.tab === 'pilotes',\n      tabPoids: s.view === 'wall' && s.tab === 'poids',\n      tabEssence: s.view === 'wall' && s.tab === 'essence',\n      tabPit: s.view === 'wall' && s.tab === 'pit',\n      tabIng: s.view === 'wall' && s.tab === 'ingenieur',\n      tabJournal: s.view === 'wall' && s.tab === 'journal',\n      tabConfig: s.view === 'wall' && s.tab === 'config',\n      tabTests: s.view === 'wall' && s.tab === 'tests',\n      tabReg: s.view === 'wall' && s.tab === 'reglement',\n      tabSimu: s.view === 'wall' && s.tab === 'simu',\n      tabPrep: s.view === 'wall' && s.tab === 'prep',\n      tabAlertes: s.view === 'wall' && s.tab === 'alertes',\n      isBoard: s.view === 'board',\n      setBoard: () => this.up(x => { x.view = 'board'; }),\n      nightFilter: s.night ? 'brightness(0.62) saturate(0.72) sepia(0.18)' : 'none',\n      preRace: s.now < c.start,\n      preCountdown: Component.hms(Math.max(0, c.start - s.now)),\n      elBrut: Component.ms(elBrut),\n      penTotalLabel: this.penaltyLaps() ? this.penaltyLaps() + (this.penaltyLaps() > 1 ? ' TOURS' : ' TOUR') : 'AUCUNE',\n      penTotalCol: this.penaltyLaps() ? RED : GREEN,\n      p: this.panels(),\n      actions: {\n        pitIn: () => this.pitIn(),\n        pitOut: () => this.pitOut(null),\n        skipNext: () => this.skipNext()\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
